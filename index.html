<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Akan Name Generator</h1>

    <p>
        Akan names originate from Ghanaian culture, where children are named
        according to the day of the week they were born. Enter your birthday and
        gender below to discover your Akan name.
    </p>

    <form id="akanForm">

        <label for="day">Day</label>
        <input type="number" id="day" placeholder="1-31">

        <label for="month">Month</label>
        <input type="number" id="month" placeholder="1-12">

        <label for="year">Year</label>
        <input type="number" id="year" placeholder="e.g. 2005">

        <label for="gender">Gender</label>
        <select id="gender">
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <button type="button" onclick="generateAkanName()">
            Generate Akan Name
        </button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
